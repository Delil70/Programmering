
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Intro</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
    var player = { 
      x: 400, 
      y: 50, 
      size: 40, 
      color: "blue", 
      speedX: 20, // hastighet på X. ingen rörelse
      speedY: 1, // negativ hastighet på Y. Nu kan Y stryras själv 
      directionX: -1,
      directionY: -1
    };

    var enemy = {

       x: 100,
       y: 100,
       bredd: 50,
       hojd: 50,
       color: "red",
       speedX: 5,
       speedY: 0,
       directionX: 1,
       directionY: 1
    }
       
    rectangle(enemy.x, enemy.y, enemy.bredd, enemy.hojd, enemy.color)
    
    
    enemy.x = enemy.x + enemy.speedX + enemy.directionX
    enemy.y = enemy.y + enemy. speedY * enemy.directionY


    function update() {
      clearScreen();
      circle(player.x, player.y, player.size, player.color);
      player.x = player.x + player.speedX * player.directionX;
      player.y = player.y + player.speedY;  player.directionY;


    }
  </script>
</body>
</html>
