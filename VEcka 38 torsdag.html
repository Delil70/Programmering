
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Intro</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
    var player = { x: 400, y: 300, size: 40, color: "blue", speed: 4 };
    function update() {
      clearScreen();
      circle(player.x, player.y, player.size, player.color);

      if (keyborad.right) {
        player.x = player.x + player.speed;
        }
        if (keyborad.left) {
          player.x = player.x - player.speed;
        }
        // Röra sig uppåt - saknas!
        // Röra sig nedåt - saknas!
        
      }

  </script>
</body>
</html>
