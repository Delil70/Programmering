
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Intro</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
    // Objekt, ex spelare

    var player = { x: 100, y: 100, size: 10, color: "blue"};
    var poang = 0;
    var coins = [];
    var coinCollected = false;
    var zombie = [];
    var liv = 3;
    

    //
    for (var i = 0; i < 10; i++) {
        coins.push( 
        {x: random(50, totalWidth - 50),y: random(50, totalHeight - 50)});
}
    for (var i = 0; i < 10; i++) {
         zombie.push(
         {x: random(50, totalWidth - 50),y: random(50, totalHeight - 50)});
      
    }

     var collectedCoins = [];

    //update körs varje bildruta
    function update() {
      //rectangle(0, 0, 800, 600, "red");
      fill("Green")
      
      


      // Hanterar rörelse av gubbe
      if (keyboard.left) 
      {
       player.x = player.x - 5;
      }
      if (keyboard.right) {
        player.x = player.x + 5;
      }
      if (keyboard.up) {
        player.y = player.y - 5;
      }
      if (keyboard.down) {
        player.y = player.y + 5;
      }
      // stoppar spelaren vid väntserkanten 
      if  (player.x < 10) {
        player.x = 10;
      }
      // stoppar spelaren vid högerkanten 
        if (player.x > totalWidth - 10) {
          player.x = totalWidth - 10;
        }

        // stoppar spelaren vid överkanten 
        if (player.y < 10) {
          player.y = 10;
        }
        // stoppar spelaren vid nederkanten 
        if (player.y > totalHeight - 10) {
          player.y = totalHeight - 10;
        }
        
        for (var i = 0; i < coins.length; i++) {
            circle(coins[i].x, coins[i].y, 10, "yellow");
            if( distance(player, coins[i]) < 20) {
              coins.splice(i,1)
              poang = poang + 1;
            }

          }  
          for (var i = 0; i < zombie.length; i++) {
            circle(zombie[i].x, zombie[i].y, 10, "red");
            if( distance(player, zombie[i]) < 20) {
              zombie.splice(i,1)
              liv = liv - 1;
          }
        }
      //Spelaren
      circle(player.x, player.y, player.size, player.color);
      text(20, 100, 40, "Poäng:"+ poang, "black");
      text(20, 190, 40, "Liv:"+ liv, "Red");
    }
    
      MÅSTE KOMMENTERA
     

  </script>
</body>
</html>
