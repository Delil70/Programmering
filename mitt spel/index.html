    //update körs varje bildruta
    function update() {
      //rectangle(0, 0, 800, 600, "red");
      fill("Green")
      
      // Hanterar rörelse av gubbe
      if (keyboard.left) 
      {
       playerX = playerX - 5;
      }
      if (keyboard.right) {
        playerX = playerX + 5;
      }
      if (keyboard.up) {
        playerY = playerY - 5;
      }
      if (keyboard.down) {
        playerY = playerY + 5;
      }
      // stoppar spelaren vid väntserkanten 
      if  (playerX < 10) {
        playerX = 10;
      }
      // stoppar spelaren vid högerkanten 
        if (playerX > totalWidth - 10) {
          playerX = totalWidth - 10;
        }

        // stoppar spelaren vid överkanten 
        if (playerY < 10) {
          playerY = 10;
        }
        // stoppar spelaren vid nederkanten 
        if (playerY > totalHeight - 10) {
          playerY = totalHeight - 10;
        }
        
        for (var i = 0; i < coins.length; i++) {
            circle(coins[i].x, coins[i].y, 10, "yellow");

            // INTE en ny loop. Denna funkar fortfarande.

}
